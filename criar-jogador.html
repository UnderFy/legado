<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Legado — Criar Jogador</title>

    <link rel="stylesheet" href="criar-jogador.css">
</head>

<body>

    <main class="creation-screen">

        <!-- TOPO -->

        <header class="topbar">

            <button class="back-button" id="backButton">
                ←
            </button>

            <div class="top-title">
                <span>LEGADO</span>
                <small>NOVA CARREIRA</small>
            </div>

            <div class="step">
                01 / 03
            </div>

        </header>


        <!-- CONTEÚDO -->

        <section class="creation-content">

            <!-- ESQUERDA -->

            <div class="player-preview">

                <div class="preview-label">
                    PRÉVIA DO JOGADOR
                </div>

                <div class="player-card">

                    <div class="player-silhouette">

                        <div class="head"></div>
                        <div class="neck"></div>

                        <div class="body">
                            <span class="shirt-number">10</span>
                        </div>

                    </div>

                    <div class="player-info-preview">

                        <strong id="previewName">
                            NOVO JOGADOR
                        </strong>

                        <span id="previewPosition">
                            PONTA DIREITA
                        </span>

                    </div>

                </div>

                <div class="appearance-buttons">

                    <button id="modelsButton">
                        MODELOS
                    </button>

                    <button id="cameraButton">
                        USAR MEU ROSTO
                    </button>

                </div>

            </div>


            <!-- DIREITA -->

            <div class="player-form">

                <div class="section-title">
                    DADOS DO JOGADOR
                </div>


                <div class="form-grid">

                    <div class="field field-large">

                        <label for="playerName">
                            NOME
                        </label>

                        <input
                            type="text"
                            id="playerName"
                            placeholder="Digite seu nome"
                            maxlength="25"
                        >

                    </div>


                    <div class="field">

                        <label for="playerNickname">
                            APELIDO
                        </label>

                        <input
                            type="text"
                            id="playerNickname"
                            placeholder="Apelido"
                            maxlength="16"
                        >

                    </div>


                    <div class="field">

                        <label for="playerAge">
                            IDADE
                        </label>

                        <select id="playerAge">

                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18" selected>18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="24">24</option>
                            <option value="25">25</option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="nationality">
                            NACIONALIDADE
                        </label>

                        <select id="nationality">

                            <option value="Brasil">
                                Brasil
                            </option>

                            <option value="Argentina">
                                Argentina
                            </option>

                            <option value="Portugal">
                                Portugal
                            </option>

                            <option value="Espanha">
                                Espanha
                            </option>

                            <option value="França">
                                França
                            </option>

                            <option value="Inglaterra">
                                Inglaterra
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="position">
                            POSIÇÃO
                        </label>

                        <select id="position">

                            <option value="Goleiro">
                                Goleiro
                            </option>

                            <option value="Zagueiro">
                                Zagueiro
                            </option>

                            <option value="Lateral">
                                Lateral
                            </option>

                            <option value="Volante">
                                Volante
                            </option>

                            <option value="Meia">
                                Meia
                            </option>

                            <option value="Ponta Direita" selected>
                                Ponta Direita
                            </option>

                            <option value="Ponta Esquerda">
                                Ponta Esquerda
                            </option>

                            <option value="Atacante">
                                Atacante
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="foot">
                            PÉ DOMINANTE
                        </label>

                        <select id="foot">

                            <option value="Direito">
                                Direito
                            </option>

                            <option value="Esquerdo">
                                Esquerdo
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="height">
                            ALTURA
                        </label>

                        <select id="height">

                            <option value="170">1,70 m</option>
                            <option value="175">1,75 m</option>
                            <option value="180" selected>1,80 m</option>
                            <option value="185">1,85 m</option>
                            <option value="190">1,90 m</option>
                            <option value="195">1,95 m</option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="weight">
                            PESO
                        </label>

                        <select id="weight">

                            <option value="65">65 kg</option>
                            <option value="70">70 kg</option>
                            <option value="75" selected>75 kg</option>
                            <option value="80">80 kg</option>
                            <option value="85">85 kg</option>
                            <option value="90">90 kg</option>

                        </select>

                    </div>

                </div>


                <div class="bottom-area">

                    <div class="warning" id="formMessage"></div>

                    <button class="continue-button" id="createPlayer">
                        CRIAR JOGADOR
                        <span>→</span>
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- MODAL DE MODELOS -->

    <div class="modal hidden" id="modelsModal">

        <div class="modal-box">

            <div class="modal-header">

                <strong>ESCOLHA O MODELO</strong>

                <button id="closeModels">
                    ×
                </button>

            </div>


            <div class="models-grid">

                <button class="model selected" data-model="01">
                    <div class="model-face face-one"></div>
                    <span>01</span>
                </button>

                <button class="model" data-model="02">
                    <div class="model-face face-two"></div>
                    <span>02</span>
                </button>

                <button class="model" data-model="03">
                    <div class="model-face face-three"></div>
                    <span>03</span>
                </button>

                <button class="model" data-model="04">
                    <div class="model-face face-four"></div>
                    <span>04</span>
                </button>

                <button class="model" data-model="05">
                    <div class="model-face face-five"></div>
                    <span>05</span>
                </button>

                <button class="model" data-model="06">
                    <div class="model-face face-six"></div>
                    <span>06</span>
                </button>

            </div>

        </div>

    </div>


    <script src="criar-jogador.js"></script>

</body>
</html>
