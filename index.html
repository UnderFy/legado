<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#05080b"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Legado"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <title>Legado</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main class="game">

        <section class="menu">

            <div class="logo">

                <span>LEGADO</span>

                <small>
                    SEU NOME. SUA HISTÓRIA.
                </small>

            </div>


            <div class="menu-buttons">

                <button id="newCareer">
                    NOVA CARREIRA
                </button>

                <button id="continueCareer">
                    CONTINUAR
                </button>

                <button id="settings">
                    CONFIGURAÇÕES
                </button>

            </div>


            <div class="version">
                LEGADO • VERSÃO 0.1
            </div>

        </section>

    </main>


    <script src="./script.js"></script>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => {

                        console.log(
                            "Legado: Service Worker ativo."
                        );

                    })
                    .catch(error => {

                        console.error(
                            "Erro ao registrar Service Worker:",
                            error
                        );

                    });

            });

        }

    </script>

</body>

</html>
